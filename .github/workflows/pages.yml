# Build the lunch page and publish it to GitHub Pages.
#
# The page is static, so it is rebuilt on a schedule rather than per request.
# Through the morning it shows today's lunch; from the late afternoon it shows
# tomorrow's, so the page is never left sitting on a day that is already over.
#
# Cron is always UTC, and the minutes are deliberately odd: GitHub delays or
# drops scheduled runs under load, and the top of the hour is its busiest
# moment, so :00 and :30 are the two worst times to ask for. No entry uses
# 12:00-13:00 UTC either, since that hour falls on opposite sides of the
# today/tomorrow cut depending on whether EET or EEST is in force.
#
# No single run is relied on. The schedule assumes runs will be dropped and
# asks often enough, and early enough in the day, that the page is right even
# when most of them are.
name: pages

on:
  schedule:
    # Weekdays, today's page. Overnight first, in the quietest hours GitHub
    # has, where a scheduled run is likeliest to actually happen, so that a
    # page for the right day exists before anyone looks even if the evening
    # before and the morning after both come to nothing. Then through the
    # morning, as the menus appear.
    - cron: "17 1 * * 1-5"        # 03:17/04:17 Helsinki: today
    - cron: "47 3 * * 1-5"        # 05:47/06:47 Helsinki: today
    - cron: "7,37 4-9 * * 1-5"    # 06:07-12:37 Helsinki, twice an hour: today
    - cron: "23 10,11 * * 1-5"    # 13:23-14:23 Helsinki, hourly: today
    # Weekends, today's page: nothing is open, so the page says so and there
    # is nothing to refresh. Two runs only, to catch the case where Friday or
    # Saturday evening was dropped and the page is still on the day before.
    - cron: "47 3 * * 0,6"        # 05:47/06:47 Helsinki: today
    - cron: "23 10 * * 0,6"       # 12:23/13:23 Helsinki: today
    # Tomorrow's page, from mid-afternoon once lunch is over. Sunday is in
    # here rather than with the weekend because Sunday evening is what builds
    # Monday, which is no less important than any other weekday morning.
    # Several attempts rather than one, because a dropped evening run is
    # exactly what leaves the next morning with nothing to fall back on.
    - cron: "12,42 13-20 * * 0-4" # 15:12-23:42 Helsinki, twice an hour: tomorrow
    # Friday and Saturday evening build an empty weekend page. It still has to
    # happen, so that the date rolls over, but three attempts is plenty.
    - cron: "12 14,17,20 * * 5,6" # 16:12/19:12/22:12 Helsinki: tomorrow
  push:
    branches: [main]
    paths-ignore: ["**.md"]     # prose changes cannot change the page
  workflow_dispatch:

# Pages deployment needs id-token; contents stays read-only since nothing is
# committed back to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; a late build should win over an earlier one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Helsinki   # every date below is the Helsinki one, not UTC
    outputs:
      sources-clean: ${{ steps.sources.outputs.clean }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the page
        run: |
          mkdir -p site
          # Which day the page is for follows the Helsinki clock rather than
          # which cron entry fired, so a manual or push-triggered run in the
          # evening also builds tomorrow.
          if [ "$(date +%-H)" -ge 15 ]; then day=tomorrow; else day=today; fi
          echo "building $day ($(date '+%Y-%m-%d %H:%M %Z'))"
          ./lounasta_web.py --build site/index.html --date "$day"

      # A restaurant being down is not a reason to withhold the whole page —
      # six cards beat yesterday's seven — so the gate here is catastrophe
      # only. Whether every source actually answered is reported separately,
      # after the deploy, so it can be noticed without blocking it.
      - name: Check the page
        shell: bash
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ./check_page.py site/index.html --allow-errors 2 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Note whether every source answered
        id: sources
        shell: bash
        run: |
          if ./check_page.py site/index.html > /dev/null 2>&1; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            ./check_page.py site/index.html 2>&1 | sed -n 's/^  - /::warning::/p' || true
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Runs after the page is already live, purely so that a source which has
  # quietly stopped answering turns the run red and sends the usual failure
  # mail, instead of sitting unnoticed behind an error card for weeks.
  sources:
    needs: [build, deploy]
    if: needs.build.outputs.sources-clean == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: A source failed
        run: |
          echo "The page was published, but not every restaurant answered."
          echo "See the 'Check the page' summary on the build job."
          exit 1
